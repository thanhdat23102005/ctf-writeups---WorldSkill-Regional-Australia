<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSTI - Python - Introduction</title>
    <link rel="stylesheet" href="/static/css/bootstrap.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/profile-spacing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="/static/icon/favicon.ico">
    
</head>
<body class="d-flex flex-column min-vh-100 mobile-container">
    <div class="app-wrapper">
    <div id="main" class="container d-flex flex-column px-0">
        <div id="banner" class="d-flex justify-content-between align-items-center mt-2 border border-1 border-start-0 border-end-0">
            <div class="d-flex justify-content-start">
                <div class="triangle triangle-left"></div>
                <div class="parallelogram"></div>
            </div>
            <h1>RMeet</h1>
            <div class="d-flex justify-content-end align-items-center">
                <div class="parallelogram"></div>
                <div class="triangle triangle-right"></div>
            </div>
        </div>
        
        
            
        
        
        
<div class="container px-4">
    <div class="text-center mt-2 mb-3">
        <h4>Find Your Match <i class="fas fa-heart text-pink"></i></h4>
    </div>

    
    <div class="swipe-container">
        <div class="profile-card" id="current-profile" data-user-id="2">
            <div class="profile-image" id="profile-carousel">
                <img src="/static/img/profiles/bruno.png" alt="Bruno Lefevre" class="carousel-image active" data-index="0">
                
                
                <img src="/static/img/profiles/bruno_1.png" alt="Bruno Lefevre" class="carousel-image" data-index="1">
                
                
                
                <img src="/static/img/profiles/bruno_2.png" alt="Bruno Lefevre" class="carousel-image" data-index="2">
                
                
                
                <img src="/static/img/profiles/bruno_3.png" alt="Bruno Lefevre" class="carousel-image" data-index="3">
                
                
                
                <img src="/static/img/profiles/bruno_4.png" alt="Bruno Lefevre" class="carousel-image" data-index="4">
                
                
                <div class="carousel-indicators">
                    <span class="indicator active" data-index="0"></span>
                    <span class="indicator" data-index="1"></span>
                    <span class="indicator" data-index="2"></span>
                    <span class="indicator" data-index="3"></span>
                    <span class="indicator" data-index="4"></span>
                </div>
                
                <div class="swipe-buttons">
                    <div class="swipe-btn dislike" id="swipe-left">
                        <i class="fas fa-times"></i>
                    </div>
                    <div class="swipe-btn like" id="swipe-right">
                        <i class="fas fa-heart"></i>
                    </div>
                </div>
            </div>
            <div class="profile-info">
                <div class="profile-name">Bruno Lefevre, 32</div>
                <div class="profile-age-location">Lyon</div>
                <div class="profile-bio">Sporty and adventurous. I climb and trail run. Always looking for new challenges!</div>
                
                
                <div class="mt-2">
                    
                    <span class="interest-tag">Climbing</span>
                    
                    <span class="interest-tag">Trail running</span>
                    
                    <span class="interest-tag">Hiking</span>
                    
                    <span class="interest-tag">Music</span>
                    
                </div>
                
            </div>
            </div>
        </div>
    </div>
    
</div>

<div class="match-overlay" id="match-overlay" style="display: none;">
    <div class="match-text">It's a Match!</div>
    <img src="" id="match-image" class="match-image" alt="Match profile">
    <div>You and <span id="match-name"></span> liked each other</div>
    <button class="match-btn" id="continue-btn">Continue Swiping</button>
</div>


        
        <nav class="mobile-nav fixed-bottom-nav">
            <div class="container">
                <div class="d-flex justify-content-around">

                        <i class="fas fa-fire"></i>
                        <span>Swipe</span>
                    </a>
                    <a href="/matches" class="nav-link ">
                        <i class="fas fa-heart"></i>
                        <span>Matches</span>
                    </a>
                    <a href="/profile/pauk01" class="nav-link ">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                    <a href="/photos" class="nav-link ">
                        <i class="fas fa-images"></i>
                        <span>Photos</span>
                    </a>
                    <a href="/logout" class="nav-link">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </nav>
        
    </div>
    
    
    
    <script src="/static/js/bootstrap.js"></script>
    
    <script nonce="" src="/config.js"></script>
    
    
<script src="/static/js/carousel.js"></script>

    <script src="/static/js/swipe.js"></script>
    
    
    
    </div>
</body>
