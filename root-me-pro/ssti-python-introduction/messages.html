<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSTI - Python - Introduction</title>
    <link rel="stylesheet" href="/static/css/bootstrap.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/profile-spacing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<body class="d-flex flex-column min-vh-100 mobile-container">
    <div class="app-wrapper">
    <div id="main" class="container d-flex flex-column px-0">
        <div id="banner" class="d-flex justify-content-between align-items-center mt-2 border border-1 border-start-0 border-end-0">
            <div class="d-flex justify-content-start">
                <div class="triangle triangle-left"></div>
                <div class="parallelogram"></div>
            </div>
            <h1>RMeet</h1>
            <div class="d-flex justify-content-end align-items-center">
                <div class="parallelogram"></div>
                <div class="triangle triangle-right"></div>
            </div>
        </div>
        
        
            
        
        
        
<div class="container px-4">
    <div class="messages-header">
        <div class="d-flex align-items-center mb-3">
            <a href="/matches" class="btn btn-sm btn-outline-secondary me-2">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="d-flex align-items-center">
                <a href="/profile/bobtester01">
                    <img src="/static/img/profiles/default.jpg" alt="bobtester01" class="message-avatar me-2">
                </a>
                <div>
                    <h5 class="mb-0">bobtester01</h5>
                    <small class="text-muted">@bobtester01</small>
                </div>
            </div>
        </div>
    </div>
    
    <div class="messages-container" id="messagesContainer">
        
            <div class="text-center text-muted my-5">
                <p>No messages yet. Say hello!</p>
            </div>
        
    </div>
    
    <div class="message-input-container">
        <form method="POST" action="/messages/bobtester01" id="messageForm">
            <div class="input-group">
                <input type="text" name="message" id="messageInput" class="form-control" placeholder="Type a message..." required>
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.messages-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: calc(100vh - 280px);
    overflow-y: auto;
    padding: 15px 0;
    margin-bottom: 10px;
}

.message-bubble {
    max-width: 75%;
    padding: 10px 15px;
    border-radius: 18px;
    position: relative;
}

.message-sent {
    align-self: flex-end;
    background-color: #FF4B6A;
    color: white;
    border-bottom-right-radius: 5px;
}

.message-received {
    align-self: flex-start;
    background-color: #f1f1f1;
    border-bottom-left-radius: 5px;
}

.message-time {
    font-size: 0.7rem;
    opacity: 0.7;
    text-align: right;
    margin-top: 3px;
}

.message-input-container {
    position: fixed;
    bottom: 95px;
    left: 0;
    right: 0;
    background-color: white;
    z-index: 1000;
    max-width: 500px;
    margin: 0 auto;
}

.message-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
}

.messages-header {
    position: sticky;
    top: 0;
    background-color: white;
    z-index: 10;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

.container.px-4 {
    padding-bottom: 70px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const messagesContainer = document.getElementById('messagesContainer');
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            messageForm.submit();
        }
    });
});
</script>

                        <i class="fas fa-images"></i>

                    <a href="/logout" class="nav-link">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </nav>
